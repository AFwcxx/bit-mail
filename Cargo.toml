[package]
name = "bit-mail"
version = "0.0.0-dev"
edition = "2024"
license = "Apache-2.0"
description = "Local-first, Git-inspired email triage framework"
repository = "https://github.com/AFwcxx/bit-mail"
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
tempfile = "3"
