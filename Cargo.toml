[package]
name = "bit-mail"
version = "0.0.0-dev"
edition = "2024"
license = "Apache-2.0"
description = "Local-first, Git-inspired email triage framework"
repository = "https://github.com/AFwcxx/bit-mail"
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
keyring = "4"
htmd = "0.5"
mail-parser = { version = "0.11", features = ["full_encoding"] }
oauth2 = { version = "5", default-features = false, features = ["reqwest-blocking"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.40", default-features = false, features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = "0.3"
url = "2"
uuid = { version = "1", features = ["serde", "v4", "v7"] }

[dev-dependencies]
tempfile = "3"
