[package]
name = "bit-mail"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
description = "Local-first, Git-inspired email triage framework"
repository = "https://github.com/AFwcxx/bit-mail"
publish = false

[features]
live-gmail-tests = []

[dependencies]
base64 = "0.22"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
httpdate = "1"
keyring = "4"
htmd = "0.5"
mail-parser = { version = "0.11", features = ["full_encoding"] }
oauth2 = { version = "5", default-features = false, features = ["reqwest-blocking"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.40", default-features = false, features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = "0.3"
url = "2"
uuid = { version = "1", features = ["serde", "v4", "v7"] }

[dev-dependencies]
blake3 = { version = "1", features = ["rayon"] }
criterion = "0.8.2"
memmap2 = "0.9"
tempfile = "3"

[[bench]]
name = "m011"
harness = false
